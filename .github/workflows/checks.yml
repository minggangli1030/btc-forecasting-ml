name: Forecasting checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[models,dev]'
      - run: python -m pytest -q
      - run: btc-forecast --demo --models naive arima xgboost
